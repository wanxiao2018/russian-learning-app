version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: russian-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: russian_learning
      MYSQL_USER: russian
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-russian123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_OWNER:-wanxiao2018}/russian-learning-backend:latest
    container_name: russian-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/russian_learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4
      SPRING_DATASOURCE_USERNAME: russian
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-russian123}
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForJWTTokenGeneration2026RussianLearning}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GITHUB_OWNER:-wanxiao2018}/russian-learning-frontend:latest
    container_name: russian-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
